<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SCP·괴담출근 풍 텍스트 호러 게임. 이상현상관리 3과 신입이 되어 사규를 지키고 살아서 퇴근하라.">
<title>사규 6조</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
/* layout: HUD 타이틀(하프톤 복도) → 본부(아이소메트릭 방 캐러셀 + 우측 인덱스) → 업무 화면. 강조색은 저채도 벽돌빨강 */
:root{color-scheme:dark;
--bg:#0d100e;--bg2:#141915;--ink:#dcdfd0;--dim:#80877a;--line:#2b332c;
--acc:#c2706a;--acc-d:#4a2421;--on-acc:#1c0f0d;--lamp:#b9cba0;--blood:#b02a2a;
--paper:#d8d4c2;--paper-ink:#24231d;--bub:#ece6d2;--bub-ink:#1d1b16;--dot:#c9cdbd;--san:1;
--disp:"Black Han Sans","Noto Sans KR",sans-serif;--ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--prose:"Noto Serif KR","Apple SD Gothic Neo",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.7;overflow-x:hidden}
button{font:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tbar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.brand b{font-family:var(--disp);font-weight:400;font-size:1.2rem;letter-spacing:.08em;display:block;line-height:1.3}
.sig{font-size:.72rem;color:var(--dim);letter-spacing:.06em}
.sig i{display:inline-flex;gap:1px;align-items:flex-end;height:9px;margin:0 .35rem;vertical-align:-1px}
.sig i s{display:block;width:3px;background:var(--acc)}
.sig i s:nth-child(1){height:3px}.sig i s:nth-child(2){height:6px}.sig i s:nth-child(3){height:9px;background:var(--line)}
.clock{text-align:right}
.clock b{font-family:var(--disp);font-weight:400;font-size:1.6rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.clock span{font-size:.75rem;color:var(--dim)}
.scan::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}

#scrTitle{position:relative;min-height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:14px}
#ht{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.tframe{position:relative;z-index:1;margin:auto;width:100%;max-width:50rem;padding:3rem 1.4rem 2.6rem;text-align:center}
.br{position:absolute;width:22px;height:22px;border:2px solid var(--acc)}
.br.a{top:0;left:0;border-right:0;border-bottom:0}.br.b{top:0;right:0;border-left:0;border-bottom:0}
.br.c{bottom:0;left:0;border-right:0;border-top:0}.br.d{bottom:0;right:0;border-left:0;border-top:0}
.eyebrow{font-size:.72rem;letter-spacing:.2em;color:var(--acc);font-weight:700}
.eyebrow em{font-style:normal;background:var(--acc);color:var(--on-acc);padding:0 .45em;margin-left:.3em;letter-spacing:.05em}
.kicker{font-family:var(--disp);letter-spacing:.7em;padding-left:.7em;font-size:clamp(.95rem,3.2vw,1.5rem);margin:1rem 0 0;color:#cfcbbb}
h1.logo{font-family:var(--disp);font-weight:400;font-size:clamp(4rem,16vw,9rem);line-height:1;margin:.1rem 0 .7rem;letter-spacing:.02em;color:#dcd7c6;text-shadow:5px 5px 0 var(--acc-d)}
.tagl{font-size:.72rem;letter-spacing:.3em;color:#bdbfb1;margin:0}
.badge{position:absolute;right:-1.4rem;top:1.6rem;transform:rotate(9deg);width:12.5rem;padding:.6rem .9rem;background:var(--acc);color:var(--on-acc);text-align:left;font-size:.68rem;letter-spacing:.06em;font-weight:700;opacity:.9}
.badge::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.6px) 0 0/5px 5px}
.badge b{position:relative;display:block;font-family:var(--disp);font-weight:400;font-size:1.3rem;letter-spacing:.03em;line-height:1.3}
.badge span{position:relative}
@media (max-width:860px){.badge{display:none}}
.tidx{margin:2.4rem auto 0;max-width:40rem;text-align:left}
.lab{display:flex;align-items:center;gap:.7rem;font-size:.66rem;letter-spacing:.3em;color:var(--dim)}
.lab::after{content:"";flex:1;height:1px;background:var(--line)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 2.4rem;margin-top:.5rem}
@media (max-width:560px){.tgrid{grid-template-columns:1fr}}
.mi{display:flex;align-items:baseline;gap:.7rem;background:none;border:0;color:var(--ink);padding:.5rem 0;cursor:pointer;text-align:left;width:100%}
.mi .k{font-size:.66rem;color:var(--dim);border:1px solid var(--line);min-width:1.4rem;text-align:center;line-height:1.5;flex:none}
.mi .t{font-size:1.28rem;font-weight:700;white-space:nowrap}
.mi .ld{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-.3rem);min-width:.5rem}
.mi .en{font-size:.6rem;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
.mi .n{font-size:.68rem;background:var(--acc);color:var(--on-acc);padding:0 .4rem;font-weight:700}
.mi:hover .t,.mi:focus-visible .t,.mi:hover .k,.mi:focus-visible .k{color:var(--acc);border-color:var(--acc)}
.mi:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
.mi[disabled]{opacity:.35;cursor:default}
.mi[disabled]:hover .t{color:var(--ink)}
.start{display:inline-flex;align-items:center;gap:1.1rem;background:var(--acc);color:var(--on-acc);border:0;font-family:var(--disp);font-size:1.55rem;letter-spacing:.1em;padding:.65rem 1.5rem .65rem 1.2rem;cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .15s,filter .15s}
.start small{font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;border:1.5px solid var(--on-acc);padding:0 .45rem;font-weight:700}
.start:hover{transform:translateY(-2px);filter:brightness(1.08)}
.start:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.start[disabled]{background:var(--line);color:var(--dim);cursor:default;transform:none;filter:none}
.tframe .start{margin-top:2.2rem}
.tfoot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.obs{background:rgba(10,13,11,.85);border:1px solid var(--line);padding:.55rem .9rem;font-size:.72rem;min-width:12rem}
.obs h3{margin:0 0 .25rem;font-size:.7rem;color:var(--acc);font-weight:700;letter-spacing:.12em}
.obs dl{display:grid;grid-template-columns:auto 1fr;gap:.05rem 1.1rem;margin:0}
.obs dt{color:var(--dim)}.obs dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.coord{font-size:.64rem;color:var(--dim);text-align:right;letter-spacing:.1em;line-height:1.6;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}

#scrHub{position:relative;min-height:100%;display:flex;flex-direction:column;gap:1.1rem;padding-block:14px;background-image:radial-gradient(rgba(201,205,189,.06) 1px,transparent 1.5px);background-size:6px 6px}
#scrHub>*{position:relative;z-index:1}
#scrHub.scan::after{z-index:3}
#scrHub.oz5::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,30,28,.35) 120%)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.8rem;align-items:center;max-width:74rem;width:100%;margin:0 auto;flex:1}
@media (max-width:880px){.hgrid{grid-template-columns:minmax(0,1fr);align-items:start}}
.stage{position:relative;max-width:46rem;margin:0 auto}
#room{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#room.hot{cursor:pointer}
#bub{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:var(--bub);color:var(--bub-ink);font-size:clamp(.7rem,1.7vw,.84rem);font-weight:700;padding:.28rem .65rem;border:2px solid var(--bub-ink);border-radius:6px;max-width:62%;width:max-content;line-height:1.45;pointer-events:none;transition:opacity .25s;text-align:center;text-wrap:balance}
#bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;background:var(--bub);border-right:2px solid var(--bub-ink);border-bottom:2px solid var(--bub-ink);transform:translateX(-50%) rotate(45deg)}
#bub.off{opacity:0}
.rcap{display:flex;align-items:center;justify-content:center;gap:1.8rem;text-align:center;margin-top:.2rem}
.rcap b{display:block;font-family:var(--disp);font-weight:400;font-size:1.75rem;letter-spacing:.06em;line-height:1.2}
.rcap small{font-size:.64rem;letter-spacing:.24em;color:var(--dim)}
.arw{background:none;border:0;color:var(--ink);font-size:1.7rem;cursor:pointer;padding:.1rem .7rem;line-height:1}
.arw:hover,.arw:focus-visible{color:var(--acc);outline:none}
.dots{display:flex;gap:.5rem;justify-content:center;margin-top:.45rem}
.dots button{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);background:none;padding:0;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
#racts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.chip{font-size:.82rem;background:rgba(20,25,21,.92);color:var(--ink);border:1px solid var(--line);padding:.3rem .85rem;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
.chip small{color:var(--dim);margin-left:.3rem}
.side{display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.pcard{border:2px solid var(--ink);border-radius:14px;padding:.8rem 1rem;background:rgba(13,16,14,.9);display:flex;flex-direction:column;gap:.7rem}
.pc-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center}
.face{width:66px;height:66px;border-radius:50%;overflow:hidden;background:#c9c5b2;border:2px solid var(--line);display:flex;justify-content:center;flex:none}
.face svg{flex:none;margin-top:-4px}
.pcard b{font-size:1.15rem;display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.pcard small{display:block;color:var(--dim);font-size:.74rem}
.ozl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--dim);font-variant-numeric:tabular-nums}
.ozl b{font-size:.74rem;display:inline;color:var(--acc)}
.ozb{height:6px;background:#1c221d;position:relative;overflow:hidden}
.ozb span{position:absolute;inset:0 auto 0 0;background:var(--acc);transition:width .6s}
.ozb i{position:absolute;top:0;bottom:0;width:1px;background:var(--bg)}
.gbox{border:2px solid var(--ink);text-align:center;padding:.25rem .65rem .1rem;line-height:1}
.gbox small{font-size:.6rem;color:var(--dim);display:block}
.gbox b{font-family:var(--disp);font-weight:400;font-size:2.1rem;display:block;line-height:1.1}
.side .mi .t{font-size:1.12rem}
.side .mi{padding:.42rem 0}
.side .start{width:100%;justify-content:space-between;font-size:1.25rem}
.toast{border-left:3px solid var(--acc);padding:.3rem .8rem;font-size:.84rem;background:rgba(194,112,106,.08)}

#app{max-width:40rem;margin:0 auto;padding-block:1rem 3rem;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .9rem;font-size:.85rem;color:var(--dim);padding:.4rem 0 1rem;border-bottom:1px solid #1e261f}
#clk{font-variant-numeric:tabular-nums;color:var(--lamp);min-width:3.2rem}
#who{display:none;flex:1;color:var(--acc);font-weight:700}
.vm #who{display:block}.vm #clk,.vm #bar,.vm #inv{display:none}
#bar{flex:1;height:5px;background:#1a211b;min-width:5rem}
#san{display:block;height:100%;width:100%;background:var(--lamp);transition:width .6s,background .6s}
#inv{width:100%;font-size:.75rem;color:var(--acc);order:9}
#inv:empty{display:none}
header button{color:var(--dim);background:none;border:1px solid #2a3329;padding:.15rem .7rem;cursor:pointer}
.vm #who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hb{color:var(--acc);border-color:var(--acc-d);font-weight:700;padding:.3rem .9rem}
.vm header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:.7rem}
header button:hover,header button:focus-visible{color:var(--ink);border-color:var(--acc);outline:none}
main{flex:1;padding-top:1.8rem}
h1{font-family:var(--disp);font-weight:400;font-size:2.4rem;letter-spacing:.1em;margin:0 0 1rem}
h1.end{color:var(--blood);font-size:2rem}
#view h2{font-family:var(--disp);font-weight:400;font-size:1.6rem;letter-spacing:.05em;margin:0 0 1rem}
#view h3{font-size:.8rem;letter-spacing:.2em;color:var(--dim);font-weight:500;margin:1.6rem 0 .4rem}
#txt{font-family:var(--prose);font-size:1.08rem;line-height:1.85;min-height:9rem;margin:0 0 2rem;white-space:pre-line}
#ch{display:flex;flex-direction:column;gap:.7rem}
#ch button,.opt{text-align:left;color:var(--ink);background:none;border:0;border-left:2px solid var(--line);padding:.45rem 1rem;cursor:pointer;transition:border-color .2s,padding .2s,color .2s}
#ch button:hover:not([disabled]),#ch button:focus-visible,.opt:hover:not([disabled]),.opt:focus-visible{border-color:var(--acc);padding-left:1.4rem;color:var(--acc);outline:none}
#ch button[disabled],.opt[disabled]{opacity:.42;cursor:default}
.opt.on{border-color:var(--acc);color:var(--acc)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.hp{position:absolute;width:min(22vw,120px);height:min(30vw,160px);color:rgba(140,28,26,.6);animation:hp 5.8s forwards}
@keyframes hp{0%{opacity:0;transform:scale(.9)}6%{opacity:.85}70%{opacity:.6}100%{opacity:0}}
.bk{position:absolute;inset:0;background:#000;animation:bk .44s steps(1) forwards}
@keyframes bk{0%{opacity:1}30%{opacity:0}55%{opacity:1}100%{opacity:0}}
.shd{position:absolute;bottom:4vh;left:-12vw;width:6vw;min-width:28px;height:18vw;min-height:84px;fill:#030303;opacity:.6;animation:shd 3.1s linear forwards}
.shd.rev{left:auto;right:-12vw;animation-name:shdr}
@keyframes shd{to{transform:translateX(118vw)}}@keyframes shdr{to{transform:translateX(-118vw)}}
#app.gl{animation:gl .5s steps(6)}
@keyframes gl{0%{transform:none}15%{transform:translate(-5px,1px) skewX(6deg);text-shadow:3px 0 rgba(255,40,60,.8),-3px 0 rgba(0,220,255,.7)}35%{transform:translate(4px,-2px);clip-path:inset(10% 0 40% 0)}55%{transform:translate(-3px,2px) skewX(-4deg);clip-path:inset(45% 0 5% 0);text-shadow:-2px 0 rgba(255,40,60,.8),2px 0 rgba(0,220,255,.7)}75%{transform:translate(2px,0);clip-path:none}100%{transform:none;text-shadow:none}}
.evbg{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;border:2px solid #050605;margin:0 0 1rem}
.evt{font-family:var(--prose);font-size:1.05rem;line-height:1.85}
.todayb{width:100%;text-align:left}
.msg{border:1px solid var(--line);border-left:3px solid #8a5a8a;padding:.6rem .9rem;margin:.7rem 0;font-family:var(--prose)}
.msg .mh{font-family:var(--ui);font-size:.75rem;color:var(--dim)}
.msg p{margin:.35rem 0}
.mr{color:var(--acc);font-size:.85rem;font-family:var(--ui)}
.evch{display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;margin:.6rem 0 1rem}
.q.wkq{border-color:var(--acc)}
b.alr{color:var(--acc)}
#map .alrt{font-size:11.5px;font-weight:700;fill:#fbf8ef;text-anchor:middle}
#sbg{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #050605;margin:0 0 1.4rem}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(194,112,106,.12)}
.chip[disabled]{opacity:.7;cursor:default}
.pxa{display:block;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.card .pv .pxa{background:#2c332e;border-radius:8px}
.got{font-size:.82rem;color:var(--acc);border:1px dashed var(--acc-d);padding:.35rem .8rem;margin:0 0 .4rem}
.sub{color:var(--dim);font-size:.85rem}
.code{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.code input{font-family:var(--disp);font-size:1.4rem;letter-spacing:.4em;width:8.5rem;text-align:center;padding:.2rem .3rem .2rem .7rem}
.code .sub{width:100%;margin:0;min-height:1.4em;font-family:var(--prose)}
.row{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:center;margin:.5rem 0}
.row>b{min-width:4.5rem;font-weight:400;color:var(--dim);font-size:.85rem}
.sw{width:1.7rem;height:1.7rem;border:2px solid transparent;border-radius:50%;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.sw:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.card{display:flex;gap:1.2rem;align-items:center;margin-bottom:1.4rem}
.card .pv{flex:none;width:110px;border-left:2px solid var(--line);padding-left:.5rem}
#pvs{width:66px;height:96px;image-rendering:pixelated;display:block;margin-top:.6rem}
input{font:inherit;background:#141a15;color:var(--ink);border:1px solid var(--line);padding:.3rem .6rem;width:10rem}
input:focus-visible{outline:1px solid var(--acc)}
.q{border-left:2px solid var(--line);padding:.2rem 1rem;margin:.6rem 0}
.q.ok{border-color:var(--acc)}
.q.ok b::after{content:" 완료";color:var(--acc);font-weight:400;font-size:.8rem}
.q.lock{opacity:.5}
.say{border-left:2px solid var(--acc);padding:.2rem 1rem;margin:1rem 0 1.4rem;min-height:5.5rem;font-family:var(--prose)}
#app.wide{max-width:64rem}
.mapw{overflow-x:auto;border:2px solid #3a352c;background:#efe9da}
#map{display:block;width:100%;height:auto;min-width:720px}
@media (min-width:760px){#map{min-width:0}}
#map text{font-family:var(--ui);fill:#2a2620}
#map .t10{font-size:10px}#map .t9{font-size:9px;font-weight:700}#map .t11{font-size:11.5px}
#map .dl1{font-family:var(--disp);font-size:26px;text-anchor:middle;letter-spacing:.04em}
#map .dl2{font-size:11px;letter-spacing:.14em;text-anchor:middle;fill:#6a6152}
#map .ct{font-family:var(--disp);font-size:23px;letter-spacing:.06em}
#map .pl{font-size:11px;fill:#7a6d55;letter-spacing:.22em;font-style:italic}
#map .plw{fill:#5d7280}
#map .nn{font-size:14px;font-weight:700;fill:#f6f1e3;text-anchor:middle}
#map .nl{font-size:14.5px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#efe9da;stroke-width:4.5px;stroke-linejoin:round}
#map .ns{font-size:11px;font-weight:500;text-anchor:middle;fill:#4a4438;paint-order:stroke;stroke:#efe9da;stroke-width:3.5px;stroke-linejoin:round}#map .ns.ok{fill:#9a4a44}#map .ns.lk{fill:#8a8578}
#map .hq{font-size:12px;font-weight:700;fill:#f6f1e3;text-anchor:middle}
#map .pn{font-size:12.5px;font-weight:500;paint-order:stroke;stroke:#efe9da;stroke-width:4px;stroke-linejoin:round}
#map .pt{font-size:11px;fill:#8a3a33;font-weight:700;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#efe9da;stroke-width:3px;stroke-linejoin:round}
#map .nd{cursor:pointer}
#map .nd:focus{outline:none}
#map .sel{fill:none;stroke:#2a2620;stroke-width:2;stroke-dasharray:3 3;opacity:0}
#map .nd:hover .sel{opacity:.5}
#map .nd.on .sel,#map .nd:focus-visible .sel{opacity:1}
.mgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.6rem;margin-top:1rem}
@media (max-width:700px){.mgrid{grid-template-columns:minmax(0,1fr)}}
#mp{min-height:9rem}
.dgrp{margin-bottom:.9rem}
.dgh{display:flex;align-items:center;gap:.5rem;font-size:.86rem;margin-bottom:.25rem}

intro:{t:"{n}. 이상현상관리 3과 신입.\n합격 통지는 이메일 한 줄이었고, 면접관의 얼굴은 기억나지 않는다.\n오늘이 첫 출근. 본부는 지하철역 지하 B2, 지도에 없는 문 뒤에 있다.",c:[{l:"문을 연다",go:"intro2"}]},
intro2:{t:"한도윤 선임이 서류 한 장을 건넨다.\n“이름 쓰고, 규칙 읽고, 질문은 하나만 해.”\n“괴담에 들어갔다 오면 뭔가 묻어 와. 우린 그걸 오염이라고 불러. 쌓이면 의무실 가고, 보고서 쓰고, 퇴근해.”\n첫 의뢰는 한빛빌딩 6층. 출동 지도는 브리핑룸에 있다.",c:[{l:"서류를 받는다",go:"hub"}]},

flick:{t:"형광등이 눈앞에서 미친 듯이 깜빡인다.\n전등 사이사이, 천장 구석에 무언가 매달려 있는 것 같다.",c:[{l:"눈을 감고 열까지 센다",go:"office",m:2,d:5},{l:"그냥 지나간다",go:"office",d:-15,v:3}]},
office:{t:"사무실. 동료들은 모니터만 보고 있다.\n자리를 세어 본다. 아홉이어야 한다.\n열 명이다.",c:[{l:"옆자리 박 과장에게 퇴사하셨냐고 묻는다",go:"quit",m:1},{l:"모른 척 자리에 앉는다",go:"badge",d:-12,v:2}]},
quit:{t:"박 과장은 잠시 가만히 있다가 고개를 끄덕인다.\n“오래 걸렸네.”\n명패에는 박정우. 그의 윤곽이 옅어지고 의자 위에 사원증만 남는다. 사무실이 숨을 내쉰다.",on:{clue:"A"},c:[{l:"사원증을 주머니에 넣고 자리에 앉는다",go:"badge",d:10}]},
badge:{t:"책상 위에 사원증이 떨어져 있다.\n사진 속 내가 웃고 있다.\n나는 지금 웃지 않는다.",c:[{l:"수첩대로 인사팀에 신고한다",go:"end_hr"},{l:"사진을 손으로 가린다",go:"clock",m:1},{l:"사원증을 서랍에 넣는다",go:"clock",d:-5}]},
end_good:{ti:"정시 출근",e:1,g:4,tt:["정시 출근자","규칙대로 9시에 자리에 앉았다."],t:"9시 정각. 팀장이 인원을 센다.\n“오늘도 정상이네.”\n모니터에는 내가 쓴 적 없는 보고서가 열려 있고, 마지막 문장은 내 말투다."},
end_late:{ti:"지각",e:1,g:2,tt:["지각생","9시를 넘겼다. 사유는 이미 적혀 있었다."],t:"9시가 지났다. 사무실 문 앞에서 아무도 나를 보지 않는다.\n지각 사유서 양식이 책상에 놓여 있다. 사유란에는 이미 누군가 적어 두었다.\n“대답했기 때문.”"},
end_ghost:{ti:"출근은 했다",e:1,g:1,tt:["퇴사 처리","자리에 앉았지만 명단에서 지워졌다."],t:"자리에는 앉았다. 그런데 아무도 인사하지 않는다.\n옆자리가 말한다. “{n} 씨는 아까 퇴사했는데.”\n내 이름이 명단에서 한 줄 지워진다."},
end_seven:{ti:"7층",e:1,g:0,tt:["7층 직원","열 번째 자리에 앉았다."],t:"문이 닫힌다. 모두가 박수를 친다.\n내 자리에는 이미 명패가 놓여 있다. 열 번째 자리다.\n여기선 아무도 퇴근하지 않는다."},
end_hr:{ti:"사규 5조",e:1,g:5,tt:["거짓 판별자","사규가 숨긴 거짓 하나를 찾아냈다.",1],t:"수화기 너머에서 답한다. “접수됐습니다.”\n그 목소리는 내 목소리다.\n“이미 대체 완료되었습니다.”\n거짓은 다섯 번째 줄이었다. 그렇다면 여섯 번째 줄은 누가, 왜 썼을까."},
/* 2 종점 정류장 */
b_start:{ti:"종점 정류장",t:"의뢰서: ‘종점 정류장. 막차 이후 하차 승객 다수 목격. 첫차까지 버틸 것.’\n0시 12분. 막차는 이미 떠났다.\n정류장에는 매표소 하나, 벤치 하나, 시간표 하나.",c:[{l:"정류장을 둘러본다",go:"b_hub",init:1}]},
b_hub:{t:"정류장. 형광등 하나가 반쯤 꺼져 있다. 첫차까지 네 시간 남짓.",c:[{l:"시간표를 본다",go:"b_board"},{l:"매표소로 간다",go:"b_booth"},{l:"벤치 아래를 살핀다",go:"b_bench",nh:"#bench"},{l:"벤치에 앉아 기다린다",go:"b_bus"}]},
b_board:{t:"시간표는 대부분 지워져 있다. 남은 것은 세 줄.\n막차 23:40\n7번 · 7층 경유\n첫차 04:50\n7번 줄만 새것처럼 선명하다.",c:[{l:"7번 노선을 소리 내어 읽는다",go:"b_read",d:-15,v:2},{l:"돌아간다",go:"b_hub"}]},
b_read:{t:"‘칠 번, 칠 층 경유.’\n읽자마자 멀리서 엔진 소리가 들린다. 없던 노선이 생겼다.",c:[{l:"돌아간다",go:"b_hub"}]},
b_bench:{t:"벤치 아래에 누군가 떨어뜨린 버스 카드. 잔액 표시가 0원에서 7원으로, 다시 0원으로 바뀐다.",on:{give:["#bench"]},c:[{l:"그대로 둔다",go:"b_hub",d:3}]},
b_booth:{t:"매표소 창구는 닫혀 있다. 커튼 너머에 앉은 그림자.\n창구 아래에 작은 금고. 번호는 네 자리다.",c:[{l:"커튼을 들춘다",go:"b_eyes",d:-20,v:1},{l:"금고를 연다",go:"b_safe",nh:"#safe"},{l:"돌아간다",go:"b_hub"}]},
b_eyes:{t:"눈이 마주쳤다. 그것은 내 표정을 따라 한다. 조금 늦게.\n커튼이 저절로 닫힌다.",c:[{l:"물러난다",go:"b_hub"}]},
b_safe:{t:"금고 다이얼은 네 자리. 손잡이에 손때가 묻어 있다.",code:{a:"0450",ok:"b_safe_ok",ph:"0000",ng:"맞지 않는다. 커튼 너머에서 그림자가 고개를 기울인다."},c:[{l:"돌아간다",go:"b_hub"}]},
b_safe_ok:{t:"금고가 열린다. 안에는 운행 일지 한 권과 투명한 유리병 하나.\n일지 마지막 장: ‘7번 버스 기사 박정우. 종점: 7층.’",on:{clue:"B",give:["#safe"],pot:1},c:[{l:"챙겨서 돌아간다",go:"b_hub"}]},
b_bus:{t:"벤치에 앉는다. 1시 30분, 버스가 들어온다. 전광판에 7번.\n문이 열리고 승객들이 내린다.",c:[{l:"승객 수를 센다",go:"b_count"},{l:"버스에 탄다",go:"end_b_ride",v:0}]},
b_count:{t:"하나, 둘, … 일곱.\n여덟 번째 승객이 내리면서 내 이름을 부른다.\n“{n} 씨.”",c:[{l:"뒤를 돌아본다",go:"end_b_swap",v:3},{l:"앞만 본다",go:"b_dawn",d:-6}]},
b_dawn:{t:"버스는 떠난다. 남은 것은 나와 매표소의 그림자.\n4시 50분. 첫차가 들어온다.\n그런데 전광판의 노선 번호가 7이다.",c:[{l:"규칙대로 첫차에 탄다",go:"end_b_seven"},{l:"운행 일지의 이름을 부른다",go:"end_b_true",need:"#safe",nl:"운행 일지 필요"},{l:"타지 않고 다음 차를 기다린다",go:"end_b_morning"}]},
end_b_ride:{ti:"7층 경유",e:1,g:0,tt:["승객","막차 이후의 버스에 탔다."],t:"버스는 출발한다. 창밖의 정류장 이름이 하나씩 바뀐다.\n종점, 한빛빌딩, 7층.\n기사가 거울로 나를 보며 말한다. “오래 기다렸어요.”"},
end_b_swap:{ti:"여덟 번째",e:1,g:0,tt:["여덟 번째","세지 말아야 할 것을 세고 돌아봤다."],t:"돌아보는 순간 여덟 번째 승객이 내 얼굴로 웃는다.\n그는 벤치에 앉고, 나는 버스 안에 서 있다.\n창밖의 내가 손을 흔든다."},
end_b_seven:{ti:"첫차",e:1,g:1,tt:["첫차 탑승객","규칙을 믿고 7번에 탔다."],t:"첫차에 오른다. 승객은 모두 정장 차림이다.\n다들 같은 사원증을 달고 있다. 3과.\n여섯 번째 규칙이 거짓이었다."},
end_b_morning:{ti:"새벽 귀가",e:1,g:3,tt:["새벽 귀가","거짓 규칙을 피해 아침을 맞았다."],t:"타지 않는다. 7번 버스는 한참 서 있다가 떠난다.\n5시 20분, 진짜 첫차가 온다. 12번. 피곤한 기사가 하품을 한다.\n의뢰서 결과란에 적는다. ‘여섯 번째 규칙 거짓.’"},
end_b_true:{ti:"노선 변경",e:1,g:5,tt:["노선 변경","7번 버스를 차고지로 돌려보냈다.",1],t:"일지에 적힌 이름을 부른다. “박정우 씨.”\n7번 버스의 기사가 고개를 든다. 3과 사원증을 단 남자.\n그는 아무 말 없이 문을 닫고, 버스는 처음으로 7층이 아닌 차고지로 간다."},
/* 3 지하주차장 B7 */
c_start:{ti:"지하주차장 B7",t:"의뢰서: ‘한빛빌딩 지하주차장. B6 아래 층 실재 여부 확인.’\n계단 표지판은 B6에서 끝나는데, 계단은 계속 이어진다.",c:[{l:"B6부터 둘러본다",go:"c_b6",init:1},{l:"곧장 계단을 내려간다",go:"c_hub",v:0,d:-5}]},
c_b6:{t:"B6 구석에 문 열린 경비실. 책상 위에 손전등과 주차권 한 장.\n주차권에는 ‘B7 · 이용 중’이라고 찍혀 있다.",c:[{l:"손전등을 챙긴다",go:"c_b6",give:"손전등",nh:"손전등"},{l:"주차권을 챙긴다",go:"c_b6",give:"주차권",nh:"주차권"},{l:"계단을 내려간다",go:"c_hub",v:0}]},
c_hub:{t:"B7. 기둥 번호가 7-1부터 7-7까지. 차는 한 대뿐이다.\n검은 세단, 시동이 걸려 있다. 출구 차단기는 반대편 끝.",ev:{at:7,go:"c_horn",f:"#horn"},c:[{l:"세단으로 간다",go:"c_car"},{l:"7-4 기둥을 살핀다",go:"c_pillar",nh:"드라이버"},{l:"천장을 비춰 본다",go:"c_ceiling",need:"손전등",v:4,d:-22},{l:"출구 차단기로 간다",go:"c_gate"}]},
c_horn:{t:"어디선가 경적이 울린다. 한 번. 두 번.\n세 번.",c:[{l:"가장 가까운 기둥 뒤에 숨는다",go:"c_hide"},{l:"소리가 난 쪽을 본다",go:"end_c_horn",v:2}]},
c_hide:{t:"기둥 뒤에 숨는다. 무언가 기둥 사이를 지나간다.\n발소리가 아니라 바퀴 소리다. 한참 뒤에 멈춘다.",c:[{l:"나온다",go:"c_hub",d:4}]},
c_car:{t:"세단 운전석에 누군가 앉아 있다. 핸들에 이마를 대고 움직이지 않는다.\n대시보드의 블랙박스 불빛이 깜빡인다.",c:[{l:"창문을 두드린다",go:"c_knock",v:3,d:-18},{l:"조수석 문을 연다",go:"c_bb",nh:"#bb"},{l:"돌아간다",go:"c_hub"}]},
c_knock:{t:"고개가 천천히 돌아간다. 몸은 그대로인데 고개만.\n그 얼굴에는 아직 표정이 정해지지 않았다.",c:[{l:"뒷걸음친다",go:"c_hub"}]},
c_bb:{t:"조수석은 잠겨 있지 않다. 블랙박스는 나사로 고정돼 있다.\n글로브박스에서 투명한 유리병 하나가 굴러 나온다.",on:{pot:1},c:[{l:"드라이버로 블랙박스를 뗀다",go:"c_bb2",need:"드라이버"},{l:"돌아간다",go:"c_hub"}]},
c_bb2:{t:"메모리를 뽑아 휴대폰에 꽂는다. 마지막 영상.\n운전석의 남자가 카메라를 본다. 3과 사원증, 박정우.\n“여섯 번째 줄은 내가 쓴 거야. 일부러. 그건….”\n영상이 끊긴다.",on:{clue:"C",give:["#bb"]},c:[{l:"챙겨서 돌아간다",go:"c_hub"}]},
c_pillar:{t:"7-4 기둥 아래 공구함. 세 자리 숫자 자물쇠.",x:[{need:"주차권",t:"\n주차권 뒷면에 볼펜 글씨. ‘247’."}],code:{a:"247",ok:"c_tool",ph:"000",ng:"맞지 않는다. 기둥 너머에서 바퀴 소리가 한 칸 다가온다."},c:[{l:"돌아간다",go:"c_hub"}]},
c_tool:{t:"공구함이 열린다. 녹슨 드라이버 하나.",c:[{l:"챙긴다",go:"c_hub",give:"드라이버"}]},
c_ceiling:{t:"빛이 천장에 닿는 순간, 천장 전체가 눈을 뜬다.\n기둥 번호가 하나씩 늘어난다. 7-8, 7-9, 7-10.",c:[{l:"손전등을 끄고 숨을 고른다",go:"c_hub"}]},
c_gate:{t:"출구 차단기. 주차권 투입구가 붉게 깜빡인다.\n차단기 너머로 B6 계단 불빛이 보인다.",c:[{l:"주차권을 넣는다",go:"c_exit",need:"주차권"},{l:"차단기를 넘는다",go:"end_c_gate",v:1},{l:"돌아간다",go:"c_hub"}]},
c_exit:{t:"차단기가 올라간다. 전광판에 글자가 뜬다.\n‘정산 완료. 이용 시간 7년.’",c:[{l:"계단을 오른다",go:"end_c_out",nh:"#bb"},{l:"블랙박스를 쥐고 계단을 오른다",go:"end_c_true",need:"#bb",nl:"블랙박스 필요"}]},
end_c_horn:{ti:"경적",e:1,g:0,tt:["운전석","세 번째 경적을 피하지 않았다."],t:"돌아본 순간 주차장 불이 모두 꺼진다.\n다시 켜졌을 때 나는 운전석에 앉아 있다.\n핸들에 이마를 대고. 움직이지 않고."},
end_c_gate:{ti:"무단 출차",e:1,g:1,tt:["무단 출차","주차권 없이 차단기를 넘었다."],t:"차단기를 넘는다. 넘었는데, 다시 B7이다.\n기둥 번호가 하나 늘었다. 7-8.\n그 기둥 뒤에 내 그림자가 먼저 와 있다."},
end_c_out:{ti:"정산 완료",e:1,g:3,tt:["정산 완료","B7에서 정상 출차했다."],t:"B6, B5, 지상. 새벽 공기가 차갑다.\n의뢰서의 답은 ‘실재함’.\n그 아래 무엇이 있었는지는 쓰지 않는다."},
end_c_true:{ti:"블랙박스",e:1,g:5,tt:["블랙박스","박정우의 마지막 영상을 가지고 나왔다.",1],t:"지상에서 영상을 다시 돌린다.\n끊기기 직전의 입 모양을 천천히 따라 읽는다.\n‘미끼야.’\n영상의 마지막 프레임, 그의 등 뒤로 문 하나가 보인다. 본부 B3의 숙직실 문이다."},
/* 4 해솔아파트 404호 */
d_start:{ti:"해솔아파트 404호",t:"의뢰서: ‘해솔아파트 404호. 전 거주자 박정우. 입주 기록 없음.’\n들어서자 등 뒤에서 문이 잠긴다. 안쪽에는 손잡이가 없다.\n냉장고에 메모가 붙어 있다. 수첩에 옮겨 적는다.",c:[{l:"거실로 들어간다",go:"d_hub",init:1}]},
d_hub:{t:"404호 거실. 벽시계는 3시 50분.\n가족 사진 액자, 냉장고, 달력, 잠긴 안방 문, 현관.",ev:{at:8,go:"d_bell",f:"#bell"},c:[{l:"가족 사진을 본다",go:"d_photo",nh:"#photo"},{l:"냉장고를 연다",go:"d_fridge"},{l:"달력을 본다",go:"d_cal"},{l:"안방에 들어간다",go:"d_room",need:"안방 열쇠"},{l:"현관문에 열쇠를 꽂는다",go:"d_door",need:"현관 열쇠"}]},
d_photo:{t:"가족 사진. 엄마, 아빠, 아이. 세 명.\n다시 보니 네 명이다. 맨 뒤에 정장 차림의 남자.",c:[{l:"사진을 엎는다",go:"d_hub",give:"#photo",d:3},{l:"자세히 본다",go:"d_photo2",v:1,d:-14}]},
d_photo2:{t:"남자의 얼굴이 점점 앞으로 나온다. 액자 유리에 금이 간다.\n목에 건 사원증. 박정우.\n그는 입 모양으로 말한다. ‘엎어.’",c:[{l:"사진을 엎는다",go:"d_hub",give:"#photo"}]},
d_fridge:{t:"냉장고 안에는 도시락 하나. 뚜껑에 ‘{n}’이라고 적혀 있다.\n아직 따뜻하다.",c:[{l:"먹는다",go:"end_d_eat",v:2},{l:"도시락 밑을 본다",go:"d_fridge2",nh:"안방 열쇠"},{l:"닫는다",go:"d_hub"}]},
d_fridge2:{t:"도시락 밑에 작은 열쇠가 테이프로 붙어 있다.\n손잡이에 ‘안방’이라고 적혀 있다.",c:[{l:"챙긴다",go:"d_hub",give:"안방 열쇠"}]},
d_cal:{t:"달력은 4월. 빨간 동그라미 세 개, 옆에 작은 번호.\n4일에 ①, 1일에 ②, 7일에 ③.\n여백의 글씨: ‘날짜가 아니라 순서.’",c:[{l:"돌아간다",go:"d_hub"}]},
d_room:{t:"안방. 책상 위에 일기장 한 권, 서랍에는 세 자리 다이얼 금고.",c:[{l:"일기장을 읽는다",go:"d_diary",nh:"#diary"},{l:"금고를 연다",go:"d_safe",nh:"현관 열쇠"},{l:"거실로 나간다",go:"d_hub"}]},
d_diary:{t:"‘4월 4일. 3과 사규를 새로 썼다. 다섯 줄은 진짜, 한 줄은 미끼.\n그것은 규칙을 먹고 산다. 거짓 규칙을 먹으면 그 자리에 묶인다.\n대신 누군가는 계속 써야 한다.’\n마지막 장은 찢겨 있다.",on:{clue:"D",give:["#diary"]},c:[{l:"일기장을 챙긴다",go:"d_room"}]},
d_safe:{t:"서랍 금고. 세 자리 다이얼.",code:{a:"417",ok:"d_key",ph:"000",ng:"맞지 않는다. 거실 벽시계가 한 칸 빨리 움직인다."},c:[{l:"그만둔다",go:"d_room"}]},
d_key:{t:"금고 안에는 현관 열쇠와 투명한 유리병 하나.",on:{pot:1},c:[{l:"챙긴다",go:"d_room",give:"현관 열쇠"}]},
d_bell:{t:"4시 4분. 초인종이 울린다.\n문 너머에서 익숙한 목소리.\n“{n} 씨, 나야. 한도윤. 문 열어.”",c:[{l:"대답한다",go:"end_d_answer",v:3},{l:"숨을 죽인다",go:"d_hub",d:-8}]},
d_door:{t:"현관 열쇠를 꽂는다. 돌아간다.",c:[{l:"나간다",go:"end_d_out",nh:"#diary"},{l:"일기장을 품에 안고 나간다",go:"end_d_true",need:"#diary",nl:"일기장 필요"}]},
end_d_eat:{ti:"입주",e:1,g:0,tt:["입주","404호의 도시락을 먹었다."],t:"맛은 기억나지 않는다.\n다 먹고 나니 거실 사진 속 사람이 다섯이다.\n맨 끝에 내가 서 있다. 웃고 있다."},

e_start:{ti:"본부 B3",t:"본부 엘리베이터에 없던 버튼이 생겼다. B3.\n기록 조각 네 개를 주머니에 넣는다. 사원증, 운행 일지, 블랙박스, 일기.",c:[{l:"B3을 누른다",go:"e_hall",init:1,v:0}]},
e_hall:{t:"B3 복도는 3과 사무실과 똑같다. 형광등, 책상, 의자 열 개.\n끝에 ‘숙직실’ 문.\n뒤에서 윤서아가 부른다. “{n} 씨, 거기 가면 안 돼요.”",c:[{l:"사원증을 보여 달라고 한다",go:"e_check"},{l:"윤서아를 따라간다",go:"end_e_follow",v:1},{l:"대답하지 않고 숙직실로 간다",go:"e_door",d:-6}]},
e_check:{t:"윤서아가 사원증을 내민다. 이름 칸이 비어 있다.\n그것은 웃으며 형광등 사이로 녹아든다.",c:[{l:"숙직실로 간다",go:"e_door",d:5}]},
e_door:{t:"숙직실 문 앞. 문틈으로 종이 넘기는 소리가 들린다.",c:[{l:"노크를 세 번 한다",go:"e_room"},{l:"그냥 문을 연다",go:"e_room",v:2,d:-20}]},
e_room:{t:"침대 하나, 책상 하나. 책상 앞에 박정우가 앉아 사규를 쓰고 있다.\n같은 여섯 줄을 수백 장째.\n그가 고개를 든다.\n“다 모았구나. 그럼 알겠네. 여섯 번째 줄은 미끼야. 그것은 미끼를 물고 여기 묶여 있어. 미끼를 지우면 풀려나고, 지운 사람이 다음 미끼를 써야 해.”",c:[{l:"여섯 번째 줄을 지운다",go:"end_e_replace"},{l:"박정우 옆에 앉아 함께 쓴다",go:"end_e_stay"},{l:"일곱 번째 줄을 새로 쓴다",go:"end_e_true",need:"#clean",nl:"오염도 50% 미만일 때만 손이 떨리지 않는다"}]},
end_e_follow:{ti:"열 번째 의자",e:1,g:0,tt:["열 번째 의자","B3에서 부르는 목소리를 따라갔다."],t:"윤서아를 따라 걷는다. 의자 열 개 중 하나가 비어 있다.\n앉으니 딱 맞는다.\n위층에서 누군가 인원을 센다. 열."},
end_e_replace:{ti:"다음 필자",e:1,g:2,tt:["다음 필자","여섯 번째 줄을 지우고 펜을 넘겨받았다."],t:"여섯 번째 줄을 지운다. 박정우의 손에서 펜이 떨어진다.\n그는 처음으로 숨을 쉬듯 웃고, 문을 열고 나간다.\n펜은 이제 내 손에 있다. 여섯 번째 줄이 비어 있다. 채워야 한다."},
end_e_stay:{ti:"숙직 근무",e:1,g:3,tt:["숙직 근무","박정우와 함께 사규를 계속 쓰기로 했다."],t:"두 사람이 같은 여섯 줄을 쓴다.\n위층에서 신입 하나가 오늘도 출근한다.\n그가 무사하길 바라며, 한 장 더 쓴다."},
end_e_true:{ti:"퇴근",e:1,g:5,tt:["퇴근","일곱 번째 규칙으로 사규를 끝냈다.",1],t:"일곱 번째 줄을 쓴다.\n‘이 사규를 쓴 사람은 퇴근한다.’\n형광등이 한 번 깜빡이고, 다시는 깜빡이지 않는다.\n박정우가 펜을 내려놓는다. “퇴근 시간이네.”\n위층 3과 사무실의 의자는 이제 아홉 개다."},
end_mind:{ti:"붕괴",e:1,g:0,tt:["응답자","정신력이 바닥나 부르는 쪽이 되었다."],t:"글자가 읽히지 않는다. 복도가 접힌다.\n누가 내 이름을 계속 부르고, 나는 어느 순간부터 대답하는 쪽이다."}

b_count:{t:"하나, 둘, … 일곱.\n여덟 번째 승객이 내리면서 내 이름을 부른다.\n“{n} 씨.”",c:[{l:"뒤를 돌아본다",go:"end_b_swap",v:3},{l:"앞만 본다",go:"b_dawn",d:-6}]},
b_dawn:{t:"열차는 떠난다. 남은 것은 나와 역무실의 그림자.\n4시 50분. 첫차가 들어온다.\n그런데 행선지 표시가 또 7이다.",c:[{l:"규칙대로 첫차에 탄다",go:"end_b_seven"},{l:"기관사 일지의 이름을 부른다",go:"end_b_true",need:"#safe",nl:"기관사 일지 필요"},{l:"타지 않고 다음 열차를 기다린다",go:"end_b_morning"}]},
end_b_ride:{ti:"칠층역 경유",e:1,g:0,tt:["승객","막차 이후의 열차에 탔다."],t:"열차가 출발한다. 창밖의 역 이름이 하나씩 바뀐다.\n한빛, 한빛빌딩, 칠층.\n안내 방송이 말한다. “이번 역은 {n} 씨가 내릴 역입니다.”"},
end_b_swap:{ti:"여덟 번째",e:1,g:0,tt:["여덟 번째","세지 말아야 할 것을 세고 돌아봤다."],t:"돌아보는 순간 여덟 번째 승객이 내 얼굴로 웃는다.\n그는 벤치에 앉고, 나는 열차 안에 서 있다.\n창밖의 내가 손을 흔든다."},
end_b_seven:{ti:"첫차",e:1,g:1,tt:["첫차 탑승객","규칙을 믿고 7호선 첫차에 탔다."],t:"첫차에 오른다. 승객은 모두 정장 차림이다.\n다들 같은 사원증을 달고 있다. 3과.\n여섯 번째 규칙이 거짓이었다."},
end_b_morning:{ti:"새벽 귀가",e:1,g:3,tt:["새벽 귀가","거짓 규칙을 피해 아침을 맞았다."],t:"타지 않는다. 7호선 열차는 한참 서 있다가 터널로 사라진다.\n5시 20분, 진짜 첫차가 온다. 피곤한 기관사가 하품을 한다.\n의뢰서 결과란에 적는다. ‘여섯 번째 규칙 거짓.’"},
end_b_true:{ti:"노선 변경",e:1,g:5,tt:["노선 변경","7호선 열차를 차량기지로 돌려보냈다.",1],t:"일지에 적힌 이름을 부른다. “박정우 씨.”\n운전실의 기관사가 고개를 든다. 3과 사원증을 단 남자.\n그는 아무 말 없이 문을 닫고, 열차는 처음으로 칠층이 아닌 차량기지로 간다."},
/* 1동 마트 */
c_start:{ti:"한빛마트",t:"의뢰서: ‘한빛마트. 폐점 후 지하주차장 B6 아래 층 실재 여부 확인.’\n폐점 방송이 끝난 매장. 계산대 불은 꺼졌고, 카트 하나가 혼자 굴러간다.",c:[{l:"매장 안쪽으로 걸어간다",go:"c_floor",init:1}]},
c_floor:{t:"냉장 코너 불빛만 켜져 있다. 진열대 사이로 방송이 다시 흐른다.\n‘고객 여러분, 영업이 종료되었습니다. 아직 계산하지 않으신 분은 7번 계산대로 와 주십시오.’",c:[{l:"7번 계산대로 간다",go:"c_till",v:0,d:-8},{l:"방송을 무시하고 직원 통로로 간다",go:"c_b6"},{l:"곧장 주차장 계단으로 내려간다",go:"c_hub",d:-5}]},
c_till:{t:"7번 계산대. 점원이 웃으며 바코드 리더기를 내민다.\n찍을 물건이 없다. 점원이 내 손목을 가리킨다.",c:[{l:"손목을 내민다",go:"end_c_till"},{l:"뒷걸음질로 직원 통로까지 물러난다",go:"c_b6",d:-6}]},
c_b6:{t:"직원 통로 끝 경비실. 문이 열려 있다.\n책상 위에 손전등과 주차권 한 장. 주차권에는 ‘B7 · 이용 중’이라고 찍혀 있다.",t2:["경비실. 책상 위가 조금 비었다. CCTV 화면 하나가 B7 계단을 비춘다.","경비실 의자가 반쯤 돌아가 있다. 방금까지 누가 앉아 있었던 것처럼."],c:[{l:"손전등을 챙긴다",go:"c_b6",give:"손전등",nh:"손전등"},{l:"주차권을 챙긴다",go:"c_b6",give:"주차권",nh:"주차권"},{l:"주차장 계단을 내려간다",go:"c_hub"}]},
c_hub:{t:"B7. 기둥 번호가 7-1부터 7-7까지. 차는 한 대뿐이다.\n검은 세단, 시동이 걸려 있다. 출구 차단기는 반대편 끝.",t2:["B7. 시동 걸린 세단의 배기음만 낮게 깔린다.","B7. 형광등이 깜빡일 때마다 기둥 그림자 길이가 다르다.","B7. 7-7 기둥 옆에 7-8이라고 적힌 기둥이 생긴 것 같다."],ev:{at:8,go:"c_horn",f:"#horn"},c:[{l:"세단으로 간다",go:"c_car"},{l:"7-4 기둥을 살핀다",go:"c_pillar",nh:"드라이버"},{l:"천장을 손전등으로 비춘다",go:"c_ceiling",need:"손전등",v:4,d:-22},{l:"출구 차단기로 간다",go:"c_gate"}]},
c_horn:{t:"어디선가 경적이 울린다. 한 번. 두 번.\n세 번.",c:[{l:"가장 가까운 기둥 뒤에 숨는다",go:"c_hide"},{l:"소리가 난 쪽을 본다",go:"end_c_horn",v:2}]},
c_hide:{t:"기둥 뒤에 숨는다. 무언가 기둥 사이를 지나간다.\n발소리가 아니라 바퀴 소리다. 한참 뒤에 멈춘다.",c:[{l:"기둥 뒤에서 나온다",go:"c_hub",d:4}]},
c_car:{t:"세단 운전석에 누군가 앉아 있다. 핸들에 이마를 대고 움직이지 않는다.\n대시보드의 블랙박스 불빛이 깜빡인다.",t2:["세단. 운전석의 사람은 그대로다. 블랙박스 불빛만 빨라졌다."],c:[{l:"창문을 두드린다",go:"c_knock",v:3,d:-18},{l:"조수석 문을 연다",go:"c_bb",nh:"#bb"},{l:"세단에서 떨어진다",go:"c_hub"}]},
c_knock:{t:"고개가 천천히 돌아간다. 몸은 그대로인데 고개만.\n그 얼굴에는 아직 표정이 정해지지 않았다.",c:[{l:"뒷걸음친다",go:"c_hub"}]},
c_bb:{t:"조수석은 잠겨 있지 않다. 블랙박스는 나사로 고정돼 있다.\n글로브박스에서 투명한 유리병 하나가 굴러 나온다.",t2:["조수석. 블랙박스 나사 네 개가 그대로 박혀 있다."],on:{pot:1},c:[{l:"드라이버로 블랙박스를 뗀다",go:"c_bb2",need:"드라이버"},{l:"조수석 문을 닫는다",go:"c_hub"}]},
c_bb2:{t:"메모리를 뽑아 휴대폰에 꽂는다. 마지막 영상.\n운전석의 남자가 카메라를 본다. 3과 사원증, 박정우.\n“여섯 번째 줄은 내가 쓴 거야. 일부러. 그건….”\n영상이 끊긴다.",on:{clue:"C",give:["#bb"]},c:[{l:"메모리를 챙긴다",go:"c_hub"}]},
c_pillar:{t:"7-4 기둥 아래 공구함. 세 자리 숫자 자물쇠.",t2:["7-4 기둥. 공구함 자물쇠가 아까와 다른 숫자에 멈춰 있다."],x:[{need:"주차권",t:"\n주차권 뒷면에 볼펜 글씨. ‘247’."}],code:{a:"247",ok:"c_tool",ph:"000",ng:"맞지 않는다. 기둥 너머에서 바퀴 소리가 한 칸 다가온다."},c:[{l:"공구함에서 손을 뗀다",go:"c_hub"}]},
c_tool:{t:"공구함이 열린다. 녹슨 드라이버 하나.",c:[{l:"드라이버를 챙긴다",go:"c_hub",give:"드라이버"}]},
c_ceiling:{t:"빛이 천장에 닿는 순간, 천장 전체가 눈을 뜬다.\n기둥 번호가 하나씩 늘어난다. 7-8, 7-9, 7-10.",c:[{l:"손전등을 끄고 숨을 고른다",go:"c_hub"}]},
c_gate:{t:"출구 차단기. 주차권 투입구가 붉게 깜빡인다.\n차단기 너머로 B6 계단 불빛이 보인다.",t2:["출구 차단기. 투입구의 붉은 불빛이 내 손을 기다린다."],c:[{l:"주차권을 넣는다",go:"c_exit",need:"주차권"},{l:"차단기를 넘는다",go:"end_c_gate",v:1},{l:"차단기에서 돌아선다",go:"c_hub"}]},
c_exit:{t:"차단기가 올라간다. 전광판에 글자가 뜬다.\n‘정산 완료. 이용 시간 7년.’",c:[{l:"계단을 오른다",go:"end_c_out",nh:"#bb"},{l:"블랙박스를 쥐고 계단을 오른다",go:"end_c_true",need:"#bb",nl:"블랙박스 필요"}]},
end_c_till:{ti:"계산 완료",e:1,g:0,tt:["바코드","7번 계산대에서 손목을 찍었다."],t:"삑. 화면에 가격이 뜬다. 0원.\n점원이 영수증을 건넨다. 품목: {n}.\n나는 진열대 맨 아래 칸에 놓인다."},
end_c_out:{ti:"정산 완료",e:1,g:3,tt:["정산 완료","마트 B7에서 정상 출차했다."],t:"B6, B5, 매장, 정문. 새벽 공기가 차갑다.\n의뢰서의 답은 ‘실재함’.\n그 아래 무엇이 있었는지는 쓰지 않는다."},
/* 1동 폐가 */
d_start:{ti:"해솔동 폐가",t:"의뢰서: ‘해솔동 폐가. 전 거주자 박정우. 철거 예정이나 매일 밤 불이 켜짐.’\n들어서자 등 뒤에서 현관문이 잠긴다. 안쪽에는 손잡이가 없다.\n먼지 쌓인 거실. 그런데 식탁 위만 깨끗하다.",c:[{l:"거실로 들어간다",go:"d_hub",init:1}]},
d_hub:{t:"폐가 거실. 멈춰야 할 벽시계가 3시 50분을 가리키며 간다.\n가족 사진 액자, 부엌 찬장, 달력, 잠긴 안방 문, 현관.",t2:["거실. 벽시계 초침 소리만 들린다.","거실. 먼지 위에 내 것이 아닌 발자국이 하나 늘었다.","거실. 식탁 위 깨끗한 자리가 사람 하나 앉을 만큼 넓어졌다."],ev:{at:8,go:"d_bell",f:"#bell"},c:[{l:"가족 사진을 본다",go:"d_photo",nh:"#photo"},{l:"부엌 찬장을 연다",go:"d_fridge"},{l:"달력을 본다",go:"d_cal"},{l:"안방에 들어간다",go:"d_room",need:"안방 열쇠"},{l:"현관문에 열쇠를 꽂는다",go:"d_door",need:"현관 열쇠"}]},
d_photo:{t:"가족 사진. 엄마, 아빠, 아이. 세 명.\n다시 보니 네 명이다. 맨 뒤에 정장 차림의 남자.",c:[{l:"사진을 엎는다",go:"d_hub",give:"#photo",d:3},{l:"자세히 본다",go:"d_photo2",v:1,d:-14}]},
d_photo2:{t:"남자의 얼굴이 점점 앞으로 나온다. 액자 유리에 금이 간다.\n목에 건 사원증. 박정우.\n그는 입 모양으로 말한다. ‘엎어.’",c:[{l:"그제야 사진을 엎는다",go:"d_hub",give:"#photo"}]},
d_fridge:{t:"찬장 안에 도시락 하나. 뚜껑에 ‘{n}’이라고 적혀 있다.\n먼지 하나 없고, 아직 따뜻하다.",t2:["찬장. 도시락 뚜껑의 내 이름이 조금 진해졌다."],c:[{l:"먹는다",go:"end_d_eat",v:2},{l:"도시락 밑을 본다",go:"d_fridge2",nh:"안방 열쇠"},{l:"찬장을 닫는다",go:"d_hub"}]},
d_fridge2:{t:"도시락 밑에 작은 열쇠가 테이프로 붙어 있다.\n손잡이에 ‘안방’이라고 적혀 있다.",c:[{l:"열쇠를 떼어 낸다",go:"d_hub",give:"안방 열쇠"}]},
d_cal:{t:"누렇게 바랜 달력은 4월. 빨간 동그라미 세 개, 옆에 작은 번호.\n4일에 ①, 1일에 ②, 7일에 ③.\n여백의 글씨: ‘날짜가 아니라 순서.’",c:[{l:"달력에서 눈을 뗀다",go:"d_hub"}]},
d_room:{t:"안방. 곰팡이 핀 벽지 아래 책상 하나. 일기장 한 권, 서랍에는 세 자리 다이얼 금고.",t2:["안방. 책상 위 먼지에 내 손자국이 남아 있다.","안방. 벽지의 곰팡이가 글씨 모양으로 번졌다. 읽을 수는 없다."],c:[{l:"일기장을 읽는다",go:"d_diary",nh:"#diary"},{l:"서랍 금고를 연다",go:"d_safe",nh:"현관 열쇠"},{l:"거실로 나간다",go:"d_hub"}]},
d_diary:{t:"‘4월 4일. 3과 사규를 새로 썼다. 다섯 줄은 진짜, 한 줄은 미끼.\n그것은 규칙을 먹고 산다. 거짓 규칙을 먹으면 그 자리에 묶인다.\n대신 누군가는 계속 써야 한다.’\n마지막 장은 찢겨 있다.",on:{clue:"D",give:["#diary"]},c:[{l:"일기장을 품에 넣는다",go:"d_room"}]},
d_safe:{t:"서랍 금고. 세 자리 다이얼.",t2:["서랍 금고. 다이얼이 차갑다."],code:{a:"417",ok:"d_key",ph:"000",ng:"맞지 않는다. 거실 벽시계가 한 칸 빨리 움직인다."},c:[{l:"서랍을 닫는다",go:"d_room"}]},
d_key:{t:"금고 안에는 현관 열쇠와 투명한 유리병 하나.",on:{pot:1},c:[{l:"열쇠를 챙긴다",go:"d_room",give:"현관 열쇠"}]},
d_bell:{t:"4시 4분. 폐가의 초인종이 울린다. 전기는 끊겨 있는데.\n문 너머에서 익숙한 목소리.\n“{n} 씨, 나야. 한도윤. 문 열어.”",c:[{l:"대답한다",go:"end_d_answer",v:3},{l:"숨을 죽인다",go:"d_hub",d:-8}]},
d_door:{t:"현관 열쇠를 꽂는다. 돌아간다.",c:[{l:"나간다",go:"end_d_out",nh:"#diary"},{l:"일기장을 품에 안고 나간다",go:"end_d_true",need:"#diary",nl:"일기장 필요"}]},
end_d_eat:{ti:"입주",e:1,g:0,tt:["입주","폐가 찬장의 도시락을 먹었다."],t:"맛은 기억나지 않는다.\n다 먹고 나니 거실 사진 속 사람이 다섯이다.\n맨 끝에 내가 서 있다. 웃고 있다."},
end_d_out:{ti:"퇴거",e:1,g:3,tt:["퇴거","열쇠로 폐가를 나왔다."],t:"밤공기가 차갑다.\n돌아보니 폐가 창문의 불이 꺼져 있다. 처음부터 그랬다는 듯이."},
/* 2동 새빛병원 */
h_start:{ti:"새빛병원",t:"의뢰서: ‘새빛병원 7층 병동. 존재하지 않는 병실에서 야간 호출 벨이 울림.’\n새벽 1시 50분. 7층 병동 복도. 간호사실은 비어 있다.",c:[{l:"간호사실로 간다",go:"h_station",init:1},{l:"복도를 따라 걷는다",go:"h_hall",init:1}]},
h_station:{t:"간호사실. 모니터에 병실 현황판. 701호부터 706호까지.\n그 옆에 근무 일지. 오늘 날짜의 서명란이 비어 있다.",t2:["간호사실. 현황판에 없던 숫자가 하나 떠 있다. 707.","간호사실. 의자가 저절로 반 바퀴 돈다."],c:[{l:"근무 일지에 서명한다",go:"h_sign",nh:"#sign",v:2},{l:"복도로 나간다",go:"h_hall"}]},
h_sign:{t:"서명하자 일지의 앞 장들이 넘어간다. 모든 날짜에 같은 서명. 박정우.\n서랍이 저절로 열린다. 약품실 열쇠와 간호 기록지 한 장.",on:{give:["약품실 열쇠","#sign"],clue:"E"},c:[{l:"챙겨서 복도로 나간다",go:"h_hall"}]},
h_hall:{t:"긴 복도. 형광등 아래 병실 문이 줄지어 있다. 701, 702, … 706.\n2시 정각, 호출 벨이 울리기 시작한다.",t2:["복도. 호출 벨이 멎지 않는다.","복도. 바닥의 비상등 화살표가 모두 707 쪽을 가리킨다.","복도. 링거 바퀴 굴러가는 소리가 등 뒤를 지나간다."],c:[{l:"벨이 울리는 병실로 간다",go:"h_707"},{l:"703호에 들어간다",go:"h_703"},{l:"약품실 문을 연다",go:"h_drug",need:"약품실 열쇠",nh:"수액 팩"},{l:"화장실 거울 앞을 지난다",go:"h_mirror",nh:"#mir"},{l:"간호사실로 간다",go:"h_station"},{l:"엘리베이터를 타고 내려간다",go:"end_h_elev",v:0}]},
h_703:{t:"703호. 환자 한 명이 누워 있다. 링거가 비어 있다.\n환자가 눈을 감은 채 묻는다. “지금 몇 시예요?”",t2:["703호. 빈 링거 줄이 바람도 없이 흔들린다. 환자는 같은 질문을 기다린다."],c:[{l:"시간을 알려 준다",go:"end_h_patient",v:3},{l:"대답 대신 새 수액을 단다",go:"h_iv",need:"수액 팩",nh:"#iv"},{l:"조용히 나온다",go:"h_hall"}]},
h_drug:{t:"약품실. 선반에 수액 팩과 투명한 유리병이 나란히 있다.",on:{give:["수액 팩"],pot:1},c:[{l:"수액 팩을 들고 나온다",go:"h_hall"}]},
h_iv:{t:"새 수액을 단다. 방울이 떨어지자 환자가 눈을 뜬다. 평범한 할머니다.\n“고마워요. 707호 사람은 매일 밤 내려와서 벨을 눌러. 자기를 꺼내 달라고.”",on:{give:["#iv"]},c:[{l:"고개를 숙이고 나온다",go:"h_hall",d:10}]},
h_mirror:{t:"화장실 거울. 내 어깨 너머에 환자복을 입은 사람이 서 있다.\n거울 속에서 그가 손목 밴드를 들어 보인다.",on:{give:["#mir"]},c:[{l:"돌아보지 않고 거울에서 떨어진다",go:"h_hall",d:-4},{l:"뒤를 돌아본다",go:"h_hall",v:4,d:-16}]},
h_707:{t:"벨이 울리는 문 앞. 문패에 707. 현황판에는 없는 병실이다.\n문틈으로 환자복 소매가 보인다. 손목 밴드에 이름이 적혀 있다.",t2:["707호 앞. 문틈의 소매가 아까보다 한 뼘 더 나와 있다."],x:[{need:"#iv",t:"\n703호 할머니의 말이 떠오른다. 매일 밤 내려와서 벨을 누르는 사람."}],c:[{l:"손목 밴드의 이름을 읽는다",go:"h_band"},{l:"문을 연다",go:"end_h_707",v:1},{l:"돌아선다",go:"h_hall"}]},
h_band:{t:"손목 밴드: 박정우. 입원일 7년 전. 소속: 이상현상관리 3과.\n문 너머에서 목소리가 묻는다. “퇴원해도 돼요?”",c:[{l:"근무 일지에 퇴원을 기록한다",go:"end_h_true",need:"#sign",nl:"근무 일지 서명 필요"},{l:"“아직은 안 돼요.” 문을 잠근다",go:"end_h_lock"}]},
end_h_elev:{ti:"하행",e:1,g:1,tt:["하행","새벽 2시에 엘리베이터를 탔다."],t:"엘리베이터는 내려간다. 6층, 5층, … B1, B2, B3.\n문이 열리자 익숙한 사무실. 3과다.\n그런데 다들 환자복을 입고 있다."},
end_h_patient:{ti:"보호자",e:1,g:0,tt:["보호자","빈 링거의 환자에게 대답했다."],t:"“2시 7분이요.”\n환자가 웃으며 일어나 내 손목에 밴드를 채운다.\n그는 걸어 나가고, 나는 침대에 눕는다. 링거가 비어 있다."},
end_h_707:{ti:"707호",e:1,g:0,tt:["707호","없는 병실의 문을 열었다."],t:"문이 열리자 병실 안이 3과 사무실이다. 책상이 열 개.\n열 번째 자리의 명패가 내 이름으로 바뀐다."},
end_h_lock:{ti:"야간 근무",e:1,g:3,tt:["야간 근무","707호를 잠그고 아침을 맞았다."],t:"문을 잠근다. 벨 소리가 멎는다.\n아침 교대 간호사가 묻는다. “밤새 별일 없었어요?”\n대답 대신 근무 일지를 덮는다."},
end_h_true:{ti:"퇴원 처리",e:1,g:5,tt:["퇴원 처리","707호 환자를 퇴원시켰다.",1],t:"퇴원란에 기록하자 문이 안쪽에서 열린다.\n환자복의 남자가 사원증을 목에 건다. 3과. 그는 짧게 고개를 숙이고 계단으로 사라진다.\n현황판의 707이 지워진다."},
/* 2동 학교 */
s_start:{ti:"한빛중학교",t:"의뢰서: ‘한빛중학교 야간 자율학습실. 하교 기록이 없는 학생 1명.’\n밤 9시. 교실마다 불이 켜져 있는데 아무도 없다. 복도 끝에서 분필 소리가 난다.",c:[{l:"1층 복도로 들어간다",go:"s_hub",init:1}]},
s_hub:{t:"1층 복도. 교무실, 계단, 그리고 7반 교실.\n7반 문 유리창에 누군가 손바닥을 대고 있다.",t2:["1층 복도. 7반 유리창의 손자국이 하나 늘었다.","1층 복도. 게시판의 급식표가 7월 7일로만 채워져 있다.","1층 복도. 분필 소리가 이제 바로 옆 교실에서 난다."],ev:{at:7,go:"s_bell",f:"#bell"},c:[{l:"교무실에 들어간다",go:"s_office"},{l:"계단을 오른다",go:"s_stairs"},{l:"7반 교실 문을 연다",go:"s_7",v:0}]},
s_office:{t:"교무실. 담임 책상 위에 7반 출석부가 펼쳐져 있다. 번호는 1번부터 31번까지.\n마지막 줄 32번에 이름이 연필로 덧쓰여 있다.",t2:["교무실. 출석부가 다시 같은 쪽으로 펼쳐져 있다."],c:[{l:"32번 이름을 소리 내어 읽는다",go:"s_call",v:3,d:-18,nh:"출석부"},{l:"소리 내지 않고 출석부를 넘긴다",go:"s_roll",nh:"출석부"},{l:"교무실을 나온다",go:"s_hub"}]},
s_roll:{t:"32번, 박정우. 비고란: ‘3과 신입 실습. 7반 담당.’\n7년 전 날짜다. 출석 칸은 오늘까지 매일 동그라미.",on:{clue:"F",give:["출석부"]},c:[{l:"출석부를 품에 넣고 나온다",go:"s_hub"}]},
s_call:{t:"“박정우.” 이름을 부르자 복도 스피커가 대답한다. “네.”\n교실마다 의자 끄는 소리가 난다.",c:[{l:"교무실 문을 닫고 숨을 고른다",go:"s_hub"}]},
s_stairs:{t:"계단. 2층 방송실로 이어진다. 오르는 동안 발소리가 하나 더 겹친다.",t2:["계단. 겹치는 발소리가 이제 바로 뒤다."],c:[{l:"칸 수를 세며 오른다",go:"s_count",v:2,nh:"#13"},{l:"세지 않고 뛰어오른다",go:"s_broad",d:-6},{l:"1층으로 내려간다",go:"s_hub"}]},
s_count:{t:"하나, 둘, … 열셋. 계단참에 붙은 쪽지.\n‘방송실 비밀번호는 오늘 오른 칸 수.’\n뒤따르던 발소리가 열세 번째 칸에서 멈춘다.",on:{give:["#13"]},c:[{l:"방송실로 간다",go:"s_broad"}]},
s_broad:{t:"2층 방송실. 문에 두 자리 번호 자물쇠.",t2:["방송실 문 앞. 자물쇠가 미세하게 떨린다."],x:[{need:"#13",t:"\n계단참의 쪽지가 떠오른다. 열셋."}],code:{a:"13",ok:"s_room",ph:"00",ng:"맞지 않는다. 스피커에서 출석 번호가 하나 앞당겨진다."},c:[{l:"1층으로 내려간다",go:"s_hub"}]},
s_room:{t:"방송실. 마이크가 켜져 있다. 학교 전체로 나가는 버튼.\n벽에 7반 단체 사진. 학생 서른한 명과 맨 뒤 정장 차림의 남자.",c:[{l:"출석부를 읽고 하교 방송을 한다",go:"end_s_true",need:"출석부",nl:"출석부 필요"},{l:"마이크에 내 이름을 말한다",go:"end_s_name",v:1},{l:"방송실에 숨어 아침을 기다린다",go:"end_s_wait"}]},
s_bell:{t:"종이 울린다. 일곱 번째 종이다.\n교실마다 의자 끄는 소리. 모두 앉으라는 신호다.",c:[{l:"가장 가까운 교실 의자에 앉는다",go:"s_hub",d:4},{l:"서서 버틴다",go:"s_8",v:4,d:-14}]},
s_8:{t:"여덟 번째 종이 울린다. 종은 일곱 번만 울려야 한다.\n복도 끝에서 누군가 출석을 부르기 시작한다. 1번, 2번….",c:[{l:"계단으로 달린다",go:"s_stairs"}]},
s_7:{t:"7반 교실. 책상 서른두 개. 아무도 없는데 서른한 개의 의자 위로 손이 올라가 있다.\n맨 뒷자리 서른두 번째 의자만 비어 있다.",c:[{l:"빈자리에 앉는다",go:"end_s_seat"},{l:"뒷걸음질로 교실을 나온다",go:"s_hub",d:-10}]},
end_s_seat:{ti:"32번",e:1,g:0,tt:["32번","7반 맨 뒷자리에 앉았다."],t:"앉자마자 출석이 시작된다. 1번, 2번, … 31번.\n“32번.”\n나는 대답한다. 다음 날 출석부에 내 이름이 연필로 덧쓰여 있다."},
end_s_name:{ti:"교내 방송",e:1,g:1,tt:["교내 방송","방송실 마이크에 내 이름을 말했다."],t:"내 이름이 학교 전체에 울린다. 교실마다 누군가 대답한다. “네.”\n대답이 서른두 번. 그중 하나가 내 목소리다."},
end_s_wait:{ti:"자율학습 종료",e:1,g:3,tt:["자율학습 종료","방송실에서 아침을 기다렸다."],t:"새벽 6시, 경비 아저씨가 방송실 문을 두드린다.\n“밤새 공부했어?”\n복도에 서른한 개의 의자가 가지런히 놓여 있다."},
end_s_true:{ti:"하교 방송",e:1,g:5,tt:["하교 방송","7반 전원을 하교시켰다.",1],t:"마이크를 켜고 출석부를 읽는다. 1번부터 31번까지, 그리고 32번.\n“오늘 자율학습은 끝났습니다. 모두 하교하세요.”\n운동장으로 서른한 개의 그림자가 걸어 나간다. 마지막 그림자가 돌아서서 넥타이를 고쳐 맨다."},
/* 3동 모텔 */
m_start:{ti:"한빛모텔",t:"의뢰서: ‘한빛모텔. 매일 밤 같은 투숙객이 체크인. 퇴실 기록 없음.’\n자정. 프런트 직원이 열쇠를 내민다. 열쇠고리 번호는 407.\n직원 뒤로 숙박부가 펼쳐져 있다.",c:[{l:"숙박부를 훔쳐본다",go:"m_book",init:1},{l:"열쇠를 받아 4층으로 올라간다",go:"m_hall",init:1}]},
m_book:{t:"숙박부. 매일 같은 줄에 같은 이름. 박정우, 4층.\n오늘 날짜 아래 칸에는 내 이름이 이미 적혀 있다.",on:{clue:"G",give:["#book"]},c:[{l:"숙박부를 슬쩍 챙겨 올라간다",go:"m_hall"}]},
m_hall:{t:"4층 복도. 붉은 카펫, 낮은 천장. 열쇠는 407인데 방 번호는 401부터 406까지뿐이다.\n406호 옆 문에는 번호판이 없다.",t2:["4층 복도. 카펫 무늬가 아까와 반대로 흐른다.","4층 복도. 406호 문틈으로 텔레비전 소리가 새어 나온다. 내 목소리다."],c:[{l:"번호판 없는 문에 열쇠를 꽂는다",go:"m_room"},{l:"406호에 들어간다",go:"end_m_406",v:0},{l:"프런트로 내려간다",go:"m_front"}]},
m_front:{t:"1층 프런트. 불이 꺼져 있다. 데스크에 ‘잠시 자리 비움’ 팻말.\n벽시계는 3시. 데스크 안쪽에서 누가 웃는 소리.",t2:["프런트. 팻말이 뒤집혀 있다. ‘곧 돌아옵니다.’"],c:[{l:"규칙대로 벨을 누른다",go:"end_m_front"},{l:"열쇠함을 뒤진다",go:"m_keys",nh:"#note"},{l:"계단으로 올라간다",go:"m_hall"}]},
m_keys:{t:"열쇠함. 401부터 406까지 고리가 비어 있다.\n맨 아래 고리에 작은 쪽지. ‘노크는 옆방의 수만큼. 마지막은 하나 더.’",on:{give:["#note"]},c:[{l:"쪽지를 챙겨 올라간다",go:"m_hall"}]},
m_room:{t:"번호판 없는 방. 침대 하나, 전화기 하나, 욕실 문.\n침대 시트가 이미 누가 누운 모양으로 꺼져 있다.",t2:["방. 시트의 꺼진 모양이 조금 커졌다.","방. 전화기 수화기가 살짝 들려 있다."],ev:{at:7,go:"m_phone",f:"#phone"},c:[{l:"욕실에 들어간다",go:"m_bath"},{l:"옆방 벽에 귀를 댄다",go:"m_knock",nh:"#exit"},{l:"꺼진 시트에 눕는다",go:"end_m_sleep"},{l:"벽에 난 문으로 나간다",go:"m_exit",need:"#exit"},{l:"복도로 나간다",go:"m_hall"}]},
m_bath:{t:"욕실 거울에 김이 서려 있다. 누가 손가락으로 쓰다 만 글씨.\n‘나가는 법은’",c:[{l:"뒤를 이어 쓴다",go:"m_write",v:2,d:-16},{l:"욕실 불을 끄고 나온다",go:"m_room"}]},
m_write:{t:"손가락이 저절로 움직인다. ‘없다.’\n거울 속의 내가 먼저 손을 뗀다.",c:[{l:"욕실을 뛰쳐나온다",go:"m_room"}]},
m_knock:{t:"벽 너머에서 노크. 똑, 똑, 똑.",c:[{l:"세 번 노크한다",go:"m_k3"},{l:"네 번 노크한다",go:"m_k4",need:"#note",nl:"프런트 쪽지 필요"},{l:"노크하지 않는다",go:"m_room",v:3,d:-12}]},
m_k3:{t:"똑, 똑, 똑. 벽 너머가 조용해진다.\n잠시 후 다시 세 번. 끝나지 않는 대화다.",c:[{l:"벽에서 떨어진다",go:"m_room",d:-4}]},
m_k4:{t:"넷째 노크가 닿는 순간 벽지가 문 모양으로 갈라진다.\n그 너머에 비상계단 표지판.",on:{give:["#exit"]},c:[{l:"갈라진 문으로 나간다",go:"m_exit"}]},
m_phone:{t:"3시 정각. 전화가 울린다. 화면에 룸서비스.",c:[{l:"받는다",go:"end_m_call",v:1},{l:"전화선을 뽑는다",go:"m_room",d:-4}]},
m_exit:{t:"비상계단. 계단참마다 번호판 없는 문이 하나씩 있다.",c:[{l:"끝까지 내려간다",go:"end_m_out",nh:"#book"},{l:"숙박부를 쥐고 내려간다",go:"end_m_true",need:"#book",nl:"숙박부 필요"}]},
end_m_406:{ti:"방 바꾸기",e:1,g:1,tt:["방 바꾸기","열쇠와 다른 방에 들어갔다."],t:"406호는 깨끗하다. 너무 깨끗하다.\n아침이 오지 않는다. 시계는 매번 자정으로 돌아가고, 프런트는 매번 내 열쇠를 내민다."},
end_m_front:{ti:"프런트",e:1,g:0,tt:["프런트","새벽 3시의 프런트 벨을 눌렀다."],t:"벨 소리에 데스크 안쪽 사람이 일어난다. 웃는 얼굴이 한 뼘씩 길어진다.\n“체크인 도와드릴까요?”\n숙박부의 내 이름이 진해진다. 프런트는 24시간 열려 있지 않았다."},
end_m_sleep:{ti:"투숙",e:1,g:0,tt:["투숙","꺼진 시트에 몸을 맞췄다."],t:"눕자 시트가 딱 맞는다. 원래 내 자리였다는 듯이.\n다음 날 밤, 숙박부에 내 이름이 한 줄 더 적힌다."},
end_m_call:{ti:"룸서비스",e:1,g:1,tt:["룸서비스","새벽 3시 전화를 받았다."],t:"“주문하신 거 올라갑니다.”\n노크가 들린다. 문을 열자 아무도 없고, 쟁반 위에 열쇠 하나. 407.\n내 방이 하나 더 생겼다."},
end_m_out:{ti:"체크아웃",e:1,g:3,tt:["체크아웃","비상계단으로 모텔을 나왔다."],t:"1층 비상문을 밀자 새벽 공기다.\n돌아보니 모텔 간판의 불이 꺼진다. 체크아웃 기록은 없다. 그래도 나왔다."},
end_m_true:{ti:"숙박부",e:1,g:5,tt:["숙박부","박정우의 숙박부를 들고 나왔다.",1],t:"비상문을 나서며 숙박부의 그 줄을 찢는다. 박정우, 4층.\n다음 날, 모텔 4층의 번호판 없는 문이 사라졌다는 보고가 올라온다."},
/* 3동 장례식장 */
j_start:{ti:"한빛장례식장",t:"의뢰서: ‘한빛장례식장 7호실. 고인 정보 없는 빈소. 매일 밤 조문객 접수.’\n자정 직전. 7호실 앞 신발장에 구두가 가득하다. 안쪽에서 낮은 곡소리.",c:[{l:"신발을 벗고 들어간다",go:"j_hub",init:1}]},
j_hub:{t:"7호실 빈소. 국화 사이로 영정 사진. 얼굴 부분이 빛에 바래 보이지 않는다.\n조문객 명부, 향로, 음식상, 그리고 상주 자리.",t2:["빈소. 곡소리가 내 숨에 박자를 맞춘다.","빈소. 국화 한 송이가 내 쪽으로 고개를 돌렸다.","빈소. 향 연기가 천장에서 글씨처럼 흩어진다."],ev:{at:8,go:"j_midnight",f:"#mid"},c:[{l:"조문객 명부를 펼친다",go:"j_book",nh:"#fake"},{l:"향을 피운다",go:"j_incense",nh:"#inc"},{l:"영정 사진을 본다",go:"j_photo"},{l:"음식상으로 간다",go:"j_food",nh:"#food"},{l:"상주 자리를 본다",go:"j_chief"}]},
j_book:{t:"조문객 명부. 이미 적힌 이름들. 한도윤, 오세온, 윤서아, 강하린. 모두 3과다.",c:[{l:"본명을 쓴다",go:"j_hub",v:1,d:-14,give:"#fake"},{l:"다른 이름을 쓴다",go:"j_hub",d:2,give:"#fake"},{l:"명부를 끝까지 넘긴다",go:"j_env",nh:"#env"}]},
j_env:{t:"명부 뒤에 부의 봉투가 끼워져 있다.\n봉투 앞면: 故 박정우. 보낸 사람: 이상현상관리 3과 일동. 날짜는 7년 뒤.",on:{clue:"H",give:["#env"]},c:[{l:"봉투를 챙기고 명부를 덮는다",go:"j_hub"}]},
j_incense:{t:"향을 집는다. 몇 개를 피울까.",c:[{l:"한 개 피운다",go:"j_hub",give:"#inc",d:4},{l:"두 개 피운다",go:"j_hub",give:"#inc",v:3,d:-12},{l:"세 개 피운다",go:"j_hub",give:"#inc",d:4}]},
j_photo:{t:"영정 사진을 본다. 하나, 둘—",c:[{l:"셋을 세기 전에 눈을 돌린다",go:"j_hub"},{l:"계속 본다",go:"j_photo2",v:0,d:-18}]},
j_photo2:{t:"셋. 바랜 얼굴에 이목구비가 떠오른다. 내 얼굴이다.\n사진 속 내가 먼저 눈을 감는다.",c:[{l:"영정 앞에서 물러난다",go:"j_hub"}]},
j_food:{t:"상주 자리 쪽에서 누가 육개장을 떠 준다. “드시고 가세요.”",c:[{l:"한 숟가락만 먹는다",go:"j_hub",give:"#food",d:6},{l:"그릇을 비운다",go:"end_j_eat",v:2},{l:"정중히 사양한다",go:"j_hub",give:"#food",d:-8}]},
j_chief:{t:"상주 자리. 규칙에는 상주가 없다고 적혀 있다.\n그런데 방석 위에 상복이 개켜져 있고, 이름표에 내 이름.",t2:["상주 자리. 상복의 이름표 글씨가 조금 더 또렷하다."],c:[{l:"상복을 입고 상주 자리에 앉는다",go:"j_sit"},{l:"상복을 밀어 두고 물러난다",go:"j_hub",d:-6}]},
j_sit:{t:"상주 자리에 앉자 곡소리가 멎는다. 조문객들이 차례로 절한다.\n맨 마지막 조문객은 정장 차림의 남자.",c:[{l:"남자에게 맞절한다",go:"j_last",need:"#inc",nl:"향을 피워 둬야 한다"},{l:"일어나 도망친다",go:"end_j_run"}]},
j_last:{t:"남자가 고개를 든다. 3과 사원증. 박정우.\n“조문 와 줘서 고마워. 근데 이건 내 장례식이 아니야. 아직.”",c:[{l:"부의 봉투를 건넨다",go:"end_j_true",need:"#env",nl:"부의 봉투 필요"},{l:"빈소를 정리하고 새벽을 기다린다",go:"end_j_out"}]},
j_midnight:{t:"자정이 지난다. 신발장 쪽에서 구두가 가지런히 놓이는 소리.\n내 구두 옆에 똑같은 구두가 한 켤레 더 있다.",c:[{l:"내 구두를 확인하고 그대로 둔다",go:"j_hub"},{l:"새 구두로 바꿔 신는다",go:"end_j_shoe",v:5}]},
end_j_eat:{ti:"상차림",e:1,g:0,tt:["상차림","빈소의 음식을 남김없이 먹었다."],t:"그릇을 비우자 상주가 일어나 내게 상복을 입힌다.\n영정 사진의 얼굴이 선명해진다. 내 얼굴이다."},
end_j_shoe:{ti:"바뀐 구두",e:1,g:0,tt:["바뀐 구두","자정 이후 신발을 바꿔 신었다."],t:"구두가 딱 맞는다. 걸음이 저절로 빈소 안쪽으로 향한다.\n영정 사진 앞에 서자 사진 속 사람이 웃으며 자리를 비켜 준다."},
end_j_run:{ti:"조문 중단",e:1,g:1,tt:["조문 중단","상주 자리에서 도망쳤다."],t:"신발도 신지 않고 복도를 달린다. 뒤에서 곡소리가 한 번에 멎는다.\n주차장에 도착해서야 깨닫는다. 발에 흰 버선이 신겨 있다."},
end_j_out:{ti:"발인",e:1,g:3,tt:["발인","빈소를 정리하고 새벽을 맞았다."],t:"국화를 정리하고 향을 끈다. 새벽 5시, 직원이 문을 연다.\n“7호실은 오늘 빈소가 없는데요.”\n영정 사진 자리가 비어 있다."},
end_j_true:{ti:"부의",e:1,g:5,tt:["부의","박정우에게 부의 봉투를 돌려주었다.",1],t:"봉투를 건넨다. 그는 날짜를 보고 웃는다. “7년 뒤라. 그럼 아직 시간 있네.”\n그가 봉투를 품에 넣고 일어서자 국화가 한꺼번에 시든다.\n장례식은 처음부터 없었다."},
/* 3동 도서관 */
l_start:{ti:"한빛시립도서관",t:"의뢰서: ‘한빛시립도서관 야간 열람실. 폐관 후에도 대출 기록이 생성됨.’\n밤 10시 폐관. 폐관 음악이 흐르기 시작한다. 열람실에는 스탠드 불빛 하나.",c:[{l:"열람실로 들어간다",go:"l_hub",init:1}]},
l_hub:{t:"열람실. 서가 번호판이 1부터 6까지. 안쪽 어둠 속에 7번 서가가 하나 더 있다.\n대출 데스크, 반납함, 스탠드 켜진 책상.",t2:["열람실. 폐관 음악이 아까 들은 소절을 또 반복한다.","열람실. 7번 서가가 조금 더 앞으로 나와 있다.","열람실. 스탠드 불빛 아래 책장이 혼자 한 장 넘어간다."],ev:{at:8,go:"l_music",f:"#music"},c:[{l:"스탠드 켜진 책상으로 간다",go:"l_desk",nh:"#ending"},{l:"7번 서가로 간다",go:"l_seven",v:3,nh:"#card"},{l:"반납함을 본다",go:"l_return"},{l:"대출 데스크로 간다",go:"l_counter",nh:"#tm"}]},
l_desk:{t:"책상 위에 펼쳐진 책. 표지 제목: ‘{n}’. 지은이 칸도 같은 이름이다.\n펼쳐진 쪽에는 내가 방금 열람실에 들어온 장면이 적혀 있다.",c:[{l:"끝까지 읽는다",go:"l_read",v:1},{l:"책을 덮는다",go:"l_hub",d:2}]},
l_read:{t:"마지막 장. ‘{n}은(는) 7번 서가 맨 아래 칸에서 대출 카드를 꺼내 반납함에 넣었다. 그리고 비상구로 나갔다.’\n그다음 장은 비어 있다.",on:{give:["#ending"]},c:[{l:"책을 덮고 일어선다",go:"l_hub",d:-6}]},
l_seven:{t:"7번 서가. 책등에 제목이 없다. 맨 아래 칸에 대출 카드 한 장.",c:[{l:"대출 카드를 꺼낸다",go:"l_card"},{l:"서가를 따라 더 깊이 들어간다",go:"end_l_stack"}]},
l_card:{t:"대출 카드. 대출자 박정우, 도서명 ‘사규 6조 원본’. 반납 기한 칸이 비어 있다.",on:{clue:"I",give:["#card"]},c:[{l:"카드를 들고 열람실로 돌아온다",go:"l_hub"}]},
l_return:{t:"반납함. 투입구 위에 ‘안을 들여다보지 마시오’.",t2:["반납함. 투입구 안쪽에서 종이 넘기는 소리가 난다."],c:[{l:"대출 카드를 넣는다",go:"l_exit",need:"#card",nl:"대출 카드 필요"},{l:"투입구 안을 들여다본다",go:"l_peek",v:0,d:-15},{l:"반납함에서 물러난다",go:"l_hub"}]},
l_peek:{t:"투입구 안에서 누가 책 제목을 읽는다. 내 이름이다.\n한 장씩 넘기는 소리.",c:[{l:"얼굴을 떼고 물러난다",go:"l_hub"}]},
l_counter:{t:"대출 데스크. 사서가 고개를 들지 않은 채 묻는다.\n“대출 기한은 언제까지로 해 드릴까요?”",c:[{l:"“내일이요.”",go:"l_hub",give:"#tm",d:3},{l:"“영원히요.”",go:"end_l_forever",v:2},{l:"대답하지 않는다",go:"l_hub",give:"#tm",d:-6}]},
l_exit:{t:"카드가 반납함으로 빨려 들어간다.\n열람실 불이 하나씩 꺼지고 비상구 등만 남는다.",c:[{l:"비상구로 나간다",go:"end_l_out",nh:"#ending"},{l:"책의 마지막 장대로 비상구로 나간다",go:"end_l_true",need:"#ending",nl:"그 책을 끝까지 읽어야 한다"}]},
l_music:{t:"폐관 음악이 마지막 소절로 넘어간다.",c:[{l:"출구로 달려 나간다",go:"end_l_early"},{l:"음악을 무시하고 열람실에 남는다",go:"l_hub",v:4,d:-14}]},
end_l_stack:{ti:"7번 서가",e:1,g:0,tt:["7번 서가","제목 없는 서가 안쪽으로 걸어 들어갔다."],t:"서가는 끝없이 이어진다. 책등의 제목이 하나씩 보이기 시작한다. 전부 사람 이름이다.\n빈칸 하나에 내 몸이 꼭 맞게 들어간다."},
end_l_forever:{ti:"무기한 대출",e:1,g:0,tt:["무기한 대출","대출 기한을 영원히라고 답했다."],t:"“처리되었습니다.” 사서가 도장을 찍는다. 대출 도서: {n}.\n나는 사서의 손에 들려 서가로 간다."},
end_l_early:{ti:"조기 퇴관",e:1,g:2,tt:["조기 퇴관","폐관 음악이 끝나기 전에 도망쳤다."],t:"음악의 마지막 음과 함께 문을 박차고 나온다.\n의뢰서에는 아무것도 적지 못했다. 다음 날 밤에도 대출 기록이 하나 생긴다. 대출자: {n}."},
end_l_out:{ti:"반납 완료",e:1,g:3,tt:["반납 완료","대출 카드를 반납하고 나왔다."],t:"비상구 너머는 도서관 뒷마당이다. 새벽 공기.\n다음 날 아침, 도서관은 대출 기록 하나가 사라졌다고 보고한다."},
end_l_true:{ti:"마지막 장",e:1,g:5,tt:["마지막 장","책의 마지막 장에 적힌 대로 나왔다.",1],t:"비상구를 나서는 순간, 그 책의 빈 장에 글씨가 채워진다.\n‘그리고 다음 날도 출근했다.’\n책은 7번 서가가 아니라 3과 자료실로 반납된다."}});
